<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Su gimtadieniu</title>
<link rel="preload" as="image" href="title.png">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; color: #fff; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  body.locked { overflow: hidden; height: 100svh; }

  .wall { position: relative; container-type: inline-size; }

  /* ---------- title laid over the photos ---------- */
  .hero {
    position: absolute; top: 0; left: 0; right: 0; height: 100svh; min-height: 420px; z-index: 5;
    display: flex; align-items: center; justify-content: center;
  }
  body.locked .hero { cursor: pointer; }
  body.entered .hero { pointer-events: none; }
  .hero .shade {
    position: absolute; inset: 0; background: rgba(0,0,0,.74); transition: opacity 1.4s ease;
  }
  .hero .glow {
    position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease;
    background: radial-gradient(ellipse 52% 42% at 50% 50%, rgba(0,0,0,.62) 0%, rgba(0,0,0,.32) 55%, rgba(0,0,0,0) 85%);
  }
  body.entered .hero .shade { opacity: 0; }
  body.entered .hero .glow { opacity: 1; }
  .hero .title {
    position: relative; display: block; width: min(78vw, 980px); max-height: 66svh; object-fit: contain;
    filter: drop-shadow(0 6px 28px rgba(0,0,0,.85)) drop-shadow(0 0 46px rgba(255, 90, 40, .22));
    opacity: 0; transform: scale(.96); transition: opacity 1.4s ease, transform 2.4s cubic-bezier(.2,.7,.2,1);
  }
  .hero .title.in { opacity: 1; transform: none; }
  @media (max-width: 640px) { .hero .title { width: 90vw; } }
  .hint, .scroll {
    position: absolute; left: 50%; bottom: max(7svh, 36px); transform: translateX(-50%);
    font-size: 12px; letter-spacing: .32em; text-transform: uppercase; white-space: nowrap;
    color: #f0cf96; text-shadow: 0 1px 8px rgba(0,0,0,.9); transition: opacity .8s ease;
  }
  .hint { animation: pulse 2.2s ease-in-out infinite; }
  .scroll { opacity: 0; font-size: 22px; letter-spacing: 0; animation: bob 2s ease-in-out infinite; }
  body.entered .hint { opacity: 0 !important; animation: none; }
  body.entered .scroll { opacity: .8; }
  @keyframes pulse { 0%,100% { opacity: .9; } 50% { opacity: .35; } }
  @keyframes bob { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 6px); } }

  /* ---------- seamless grid (repeats endlessly) ---------- */
  .grid {
    --cols: 5;
    display: grid; gap: 0; line-height: 0;
    grid-template-columns: repeat(var(--cols), 1fr);
    grid-auto-rows: calc(100cqw / var(--cols) * 1.5);   /* 2:3 portrait cells */
    grid-auto-flow: row dense;
  }
  @media (max-width: 640px) { .grid { --cols: 3; } }
  .grid .cell { all: unset; display: block; position: relative; overflow: hidden; background: #0b0b0b; cursor: zoom-in; }
  .grid .cell.wide   { grid-column: span 2; }
  .grid .cell.narrow { grid-column: span 1; }
  .grid .cell.big    { grid-column: span 2; grid-row: span 2; }
  .grid .cell.tall   { grid-row: span 2; }
  .grid img, .grid video {
    display: block; width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity .7s ease, transform .7s ease;
  }
  .grid .loaded { opacity: 1; }
  @media (hover: hover) { .grid .cell:hover img, .grid .cell:hover video { transform: scale(1.035); } }
  #more { height: 1px; }

  /* ---------- full-size view ---------- */
  #view {
    position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.95);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden; transition: opacity .3s, visibility .3s; cursor: zoom-out;
  }
  #view.open { opacity: 1; visibility: visible; }
  #view .media { max-width: 100vw; max-height: 100svh; display: flex; }
  #view img, #view video { max-width: 100vw; max-height: 100svh; object-fit: contain; display: block; }
  #view .nav {
    all: unset; position: absolute; top: 0; bottom: 0; width: 16vw; cursor: pointer;
    display: flex; align-items: center; font-size: 28px; color: #fff; opacity: .4; transition: opacity .2s;
  }
  #view .nav:hover { opacity: 1; }
  #view .prev { left: 0; justify-content: flex-start; padding-left: 3vw; }
  #view .next { right: 0; justify-content: flex-end; padding-right: 3vw; }
  @media (max-width: 640px) { #view .nav { display: none; } }

  /* ---------- music button ---------- */
  #music {
    all: unset; position: fixed; right: 18px; bottom: 18px; z-index: 50; cursor: pointer;
    width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,.55);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center; gap: 3px;
    opacity: 0; pointer-events: none; transition: opacity .6s;
  }
  body.entered #music { opacity: 1; pointer-events: auto; }
  #music span { width: 3px; height: 16px; background: #f0cf96; border-radius: 2px; transform-origin: bottom; animation: eq 1s ease-in-out infinite; }
  #music span:nth-child(2) { animation-delay: -.3s; }
  #music span:nth-child(3) { animation-delay: -.6s; }
  #music.paused span { animation: none; transform: scaleY(.25); }
  @keyframes eq { 0%,100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
</style>
</head>
<body class="locked">

<section class="wall">
  <div class="hero" id="hero" role="button" aria-label="spausk">
    <div class="shade"></div>
    <div class="glow"></div>
    <img class="title" src="title.png" alt="Su gimtadieniu">
    <div class="hint">spausk &nbsp;♪</div>
    <div class="scroll" aria-hidden="true">&#8595;</div>
  </div>
  <div id="blocks"></div>
  <div id="more"></div>
</section>

<div id="view" aria-hidden="true">
  <button class="nav prev" aria-label="Previous">&#8592;</button>
  <div class="media"></div>
  <button class="nav next" aria-label="Next">&#8594;</button>
</div>

<button id="music" class="paused" aria-label="Music on / off"><span></span><span></span><span></span></button>
<audio id="song" src="song.mp3" loop preload="auto"></audio>

<script>
(() => {
  const ITEMS = [{"src": "media/01.jpg", "type": "img", "feature": 1}, {"src": "media/02.jpg", "type": "img"}, {"src": "media/03.jpg", "type": "img", "feature": 5}, {"src": "media/04.jpg", "type": "img"}, {"src": "media/05.jpg", "type": "img", "feature": 2}, {"src": "media/06.jpg", "type": "img", "tall": 1}, {"src": "media/07.jpg", "type": "img"}, {"src": "media/08.jpg", "type": "img", "tall": 2}, {"src": "media/09.jpg", "type": "img", "tall": 3}, {"src": "media/10.jpg", "type": "img", "tall": 4}, {"src": "media/11.jpg", "type": "img", "tall": 5}, {"src": "media/12.jpg", "type": "img", "tall": 6}, {"src": "media/13.jpg", "type": "img"}, {"src": "media/14.mp4", "type": "video", "poster": "media/14-poster.jpg"}, {"src": "media/15.jpg", "type": "img"}, {"src": "media/16.jpg", "type": "img"}, {"src": "media/17.jpg", "type": "img", "feature": 3}, {"src": "media/18.mp4", "type": "video", "poster": "media/18-poster.jpg"}, {"src": "media/19.jpg", "type": "img"}, {"src": "media/20.jpg", "type": "img", "feature": 4}, {"src": "media/21.jpg", "type": "img", "wide": true}, {"src": "media/22.jpg", "type": "img"}, {"src": "media/23.jpg", "type": "img"}, {"src": "media/24.jpg", "type": "img"}, {"src": "media/25.jpg", "type": "img"}, {"src": "media/26.jpg", "type": "img"}, {"src": "media/27.jpg", "type": "img"}, {"src": "media/28.jpg", "type": "img"}, {"src": "media/29.jpg", "type": "img"}, {"src": "media/30.jpg", "type": "img"}, {"src": "media/31.jpg", "type": "img"}, {"src": "media/32.jpg", "type": "img"}, {"src": "media/33.jpg", "type": "img"}];   // {src, type:'img'|'video', poster?, wide?, feature?, tall?}
  const blocksEl = document.getElementById('blocks');
  const blocks = [];          // each block is one full set of photos; the wall repeats block after block

  /* Choose tile sizes so every block ends on a full row — blocks then stack with no seams.
     Options: landscape photos 2 wide (+1 cell), 2x2 features (+3), 1x2 tall tiles (+1). */
  let plan = null;
  function computePlan() {
    const probe = blocks[0] || blocksEl;
    const C = parseInt(getComputedStyle(probe).getPropertyValue('--cols')) || (matchMedia('(max-width: 640px)').matches ? 3 : 5);
    const N = ITEMS.length, L = ITEMS.filter(it => it.wide).length;
    const nF = ITEMS.filter(it => it.feature).length, nT = ITEMS.filter(it => it.tall).length;
    let best = null;
    for (let w = L; w >= 0; w--) for (let a = 0; a <= Math.min(nF, C); a++) for (let t = 0; t <= Math.min(nT, C); t++) {
      if ((N + w + 3 * a + t) % C) continue;
      const cost = 10 * (L - w) + a + 2.5 * t;
      if (!best || cost < best.cost) best = { w, a, t, cost };
    }
    best = best || { w: L, a: 0, t: 0 };
    const ranked = key => ITEMS.map((it, i) => it[key] ? i : -1).filter(i => i >= 0).sort((x, y) => ITEMS[x][key] - ITEMS[y][key]);
    plan = {
      big: new Set(ranked('feature').slice(0, best.a)),
      tall: new Set(ranked('tall').slice(0, best.t)),
      wide: new Set(ITEMS.map((it, i) => it.wide ? i : -1).filter(i => i >= 0).slice(0, best.w)),
    };
  }
  function applyPlan(grid) {
    [...grid.children].forEach((c, i) => {
      c.classList.toggle('big', plan.big.has(i));
      c.classList.toggle('tall', plan.tall.has(i));
      c.classList.toggle('narrow', !!ITEMS[i].wide && !plan.wide.has(i));
    });
  }

  /* play videos only while on screen */
  const vio = new IntersectionObserver(es => es.forEach(e => {
    const v = e.target.querySelector('video'); if (!v) return;
    e.isIntersecting ? v.play().catch(() => {}) : v.pause();
  }), { rootMargin: '100px' });

  function addBlock() {
    const first = blocks.length === 0;
    const grid = document.createElement('div');
    grid.className = 'grid';
    ITEMS.forEach((it, i) => {
      const b = document.createElement('button');
      b.className = 'cell' + (it.wide ? ' wide' : '');
      b.setAttribute('aria-label', (it.type === 'video' ? 'Video ' : 'Photo ') + (i + 1));
      let m;
      if (it.type === 'video') {
        m = document.createElement('video');
        Object.assign(m, { muted: true, loop: true, playsInline: true, preload: 'metadata', poster: it.poster });
        m.setAttribute('muted', ''); m.setAttribute('playsinline', '');
        m.src = it.src;
        m.addEventListener('loadeddata', () => m.classList.add('loaded'));
        vio.observe(b);
      } else {
        m = new Image();
        m.loading = first && i < 12 ? 'eager' : 'lazy';
        m.decoding = 'async';
        m.alt = '';
        m.onload = () => m.classList.add('loaded');
        m.src = it.src;
        if (m.complete) m.classList.add('loaded');
      }
      b.appendChild(m);
      b.addEventListener('click', () => openView(i));
      grid.appendChild(b);
    });
    blocksEl.appendChild(grid);
    blocks.push(grid);
    if (!plan) computePlan();
    applyPlan(grid);
  }

  addBlock(); addBlock();
  matchMedia('(max-width: 640px)').addEventListener('change', () => { computePlan(); blocks.forEach(applyPlan); });

  /* endless: when the end comes near, add another copy of the wall */
  new IntersectionObserver(es => { if (es[0].isIntersecting) addBlock(); }, { rootMargin: '0px 0px 1600px 0px' })
    .observe(document.getElementById('more'));

  /* ---------- full-size view ---------- */
  const view = document.getElementById('view');
  const box = view.querySelector('.media');
  let current = -1;
  function openView(i) {
    current = i; const it = ITEMS[i];
    box.innerHTML = '';
    let m;
    if (it.type === 'video') {
      m = document.createElement('video');
      Object.assign(m, { muted: true, loop: true, autoplay: true, playsInline: true, poster: it.poster, src: it.src });
      m.setAttribute('muted', ''); m.setAttribute('playsinline', '');
    } else { m = new Image(); m.src = it.src; m.alt = ''; }
    box.appendChild(m);
    view.classList.add('open'); view.setAttribute('aria-hidden', 'false');
  }
  function closeView() { view.classList.remove('open'); view.setAttribute('aria-hidden', 'true'); current = -1; setTimeout(() => { if (current < 0) box.innerHTML = ''; }, 300); }
  function step(d) { if (current >= 0) openView((current + d + ITEMS.length) % ITEMS.length); }
  view.addEventListener('click', closeView);
  view.querySelector('.prev').addEventListener('click', e => { e.stopPropagation(); step(-1); });
  view.querySelector('.next').addEventListener('click', e => { e.stopPropagation(); step(1); });
  document.addEventListener('keydown', e => {
    if (current < 0) return;
    if (e.key === 'Escape') closeView();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
  let tx = null;
  view.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  view.addEventListener('touchend', e => {
    if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 50) { e.preventDefault(); step(dx < 0 ? 1 : -1); }
  });

  /* ---------- enter + music (browsers only allow sound after a tap/click) ---------- */
  const hero = document.getElementById('hero');
  const titleImg = hero.querySelector('.title');
  const song = document.getElementById('song');
  const musicBtn = document.getElementById('music');
  const showTitle = () => titleImg.classList.add('in');
  titleImg.complete ? requestAnimationFrame(showTitle) : titleImg.addEventListener('load', showTitle);

  function setPlaying(on) { musicBtn.classList.toggle('paused', !on); }
  function enter() {
    if (document.body.classList.contains('entered')) return;
    document.body.classList.add('entered');
    document.body.classList.remove('locked');
    hero.removeAttribute('role');
    song.volume = 0;
    song.play().then(() => {
      setPlaying(true);
      let v = 0; const t = setInterval(() => { v = Math.min(1, v + 0.04); song.volume = v; if (v >= 1) clearInterval(t); }, 90);
    }).catch(() => setPlaying(false));
  }
  hero.addEventListener('click', enter);
  document.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { if (!document.body.classList.contains('entered')) { e.preventDefault(); enter(); } } });
  musicBtn.addEventListener('click', () => {
    if (song.paused) { song.play(); setPlaying(true); } else { song.pause(); setPlaying(false); }
  });
})();
</script>
</body>
</html>
